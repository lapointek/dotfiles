[shell]
niri_overview_type_to_launch_enabled = true

[theme.templates]
enable_builtin_templates = true
builtin_ids              = ["alacritty", "gtk4", "qt"]        # opt-in; run: noctalia theme --list-templates

[idle]
# Canonical evaluation order for named behaviors. Names not listed are appended.
behavior_order = ["lock", "screen-off", "suspend"]
# Seconds to fade a fullscreen surface-tint overlay, then run the idle command.
# 0 disables the overlay (the command runs as soon as the compositor reports idle).
# Parsed between 0 and 120; the in-app Settings stepper uses whole seconds 0–30.
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true		    # explicitly disabled in the default config

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"       # turns monitors off, and back on when you return
enabled = true		    # explicitly disabled in the default config

[idle.behavior.suspend]
timeout = 900
action = "lock_and_suspend" # or action = "suspend" with lock_before_suspend = false
enabled = true

[idle.behavior.custom]
timeout = 48
action = "command"
command = "notify-send 'Idle' 'Going idle'"
resume_command = "notify-send 'Idle' 'Back from idle'"
enabled = false

[wallpaper]
enabled     = true
fill_mode   = "crop"    # center | crop | fit | stretch | repeat | span
fill_color  = "#111111" # optional fallback/fill color; image wallpapers take priority
transition  = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
                                # array of effects picked at random each transition
                                # omit to use all effects
transition_duration = 1500      # milliseconds
edge_smoothness     = 0.3       # 0.0 – 1.0
transition_on_startup = true    # animate the first wallpaper at shell startup (v4-style)

# Directory browsed by the wallpaper picker panel
directory           = "/home/kevin/.local/share/wallpapers"
# Theme-aware directories (used when theme mode is Light/Dark; Auto falls back to directory)
# directory_light     = "/home/user/Wallpapers/Light"
# directory_dark      = "/home/user/Wallpapers/Dark"
# Enable per-monitor directory overrides (default: false)
per_monitor_directories = false

[wallpaper.default]
#path = "/home/user/Wallpapers/default.png"

[wallpaper.automation]
enabled                      = false
interval_seconds             = 1800
order                        = "random" # random | alphabetical
recursive                    = true     # scan subdirectories when selecting random wallpapers

# Per-monitor overrides - same match rules as bar monitor overrides
# Only active when per_monitor_directories = true
[wallpaper.monitor.DP-2]
enabled         = false
fill_color      = "#202020"
directory       = "/home/user/Wallpapers/Vertical"
directory_light = "/home/user/Wallpapers/Vertical/Light"
directory_dark  = "/home/user/Wallpapers/Vertical/Dark"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/kevin/.local/share/wallpapers/others/purple-death.png"
theme_mode = "dark"
wallpaper_scheme = "soft"

[backdrop]
enabled        = false
blur_intensity = 0.5    # 0.0 = no blur, 1.0 = maximum blur
tint_intensity = 0.3    # 0.0 = no tint, 1.0 = fully opaque tint

[nightlight]
enabled = true
force   = false   # hold night temperature, ignoring the schedule

temperature_day   = 6500       # Kelvin (must be > temperature_night by at least 100)
temperature_night = 4000       # Kelvin

[location]
auto_locate = false            # resolve coordinates from your IP address when true
address     = "Toronto, ON"    # geocoded when auto_locate = false and non-empty
# latitude  = 52.5200          # manual coordinates, used when auto_locate and address are off
# longitude = 13.4050

# Custom schedule - pick your own day/night times instead of computing them:
# custom_schedule = true
# sunset          = "20:30"    # HH:MM - night starts
# sunrise         = "07:30"    # HH:MM - day starts
