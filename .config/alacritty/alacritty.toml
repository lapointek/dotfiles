[general]
import = [
    "~/.config/alacritty/themes/noctalia.toml"
]

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[keyboard]
bindings = [
  { key = "N", mods = "Super|Shift", action = "SpawnNewInstance" },
]

[window]
padding = { x = 5, y = 5 }
dynamic_padding = true
